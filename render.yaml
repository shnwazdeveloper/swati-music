services:
  - type: web
    name: Swati Music
    env: python
    buildCommand: "pip install -U pip && pip install -U -r requirements.txt"
    startCommand: "bash start"
    envVars:
      - key: PORT
        value: 8080
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SESSION
        sync: false
